interface:
  display_name: "K1 需求对齐、预检与运行验收"
  short_description: "不依赖本地分支；支持线上备份、钉钉 DownKey、游戏/战场测试服部署和运行补验"
  default_prompt: "使用 $review-k1-function；独立准备环境时，按线上 SID、代码分支、配表分支自动备份，从钉钉关联 DownKey，部署本人游戏服或战场服并校验运行状态，未指定 KVK 保留列表则全量恢复。功能审核则从 Jira 或分支定位三端，从实时 origin 冻结来源，先对齐需求和用例，再静态预检、运行验收与持续补验。沿用已有授权和回执，不重复触发构建，不将环境就绪当作功能验收通过。"
